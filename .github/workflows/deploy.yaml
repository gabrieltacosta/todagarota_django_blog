name: CI/CD Pipeline - Deploy para GitHub Packages

on:
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*' # Dispara ao criar tags como v1.0.1, v1.0.0, etc.
  pull_request:
    branches:
      - prod

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permissão para escrever no GitHub Packages (GHCR)

    steps:
      # 1. Clona o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Converte o nome do repositório para minúsculas (Exigência estrita do GHCR)
      - name: Lowercase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 3. Configura o QEMU para suporte a ARM64 (se a VPS do Coolify/Portainer for ARM)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Configura o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Faz login no GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extrai tags e labels automaticamente baseados no Git
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      # 7. Compila a imagem e envia para o GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Usa o cache do GitHub Actions para builds rápidos
          cache-to: type=gha,mode=max

      # 8. (Opcional) Dispara o Webhook do Coolify / Portainer para deploy automático
      - name: Trigger Deploy Webhook
        if: (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request' && env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          curl -X GET "$COOLIFY_WEBHOOK"