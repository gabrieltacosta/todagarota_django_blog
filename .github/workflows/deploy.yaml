name: CI/CD Pipeline - Deploy para GitHub Packages

on:
  push:
    branches:
      - prod
    tags:
      - 'v*.*.*' # Dispara ao criar tags como v1.0.0
  pull_request:
    branches:
      - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/seu-usuario/nome-do-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessário para publicar no GitHub Packages (GHCR)

    steps:
      # 1. Clona o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Faz login no GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extrai tags e labels automaticamente baseados no Git (ex: latest, v1.0.0, sha-xxxx)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=

      # 5. Compila a imagem para AMD64 e envia para o GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Usa o cache do GitHub Actions para builds rápidos
          cache-to: type=gha,mode=max

      # 6. (Opcional) Dispara o Webhook do Coolify/Easypanel para deploy automático
      #- name: Trigger Deploy Webhook
      #  if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.COOLIFY_WEBHOOK_URL != ''
      #  run: |
      #    curl -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"